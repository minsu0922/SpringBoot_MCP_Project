<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부서별 안내 - 샘물교회</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('worship-department')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">DEPARTMENT</div>
        <h1>부서별 안내</h1>
        <p class="page-hero-sub">Ministry Departments</p>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/worship/schedule">예배 안내</a>
        <span class="breadcrumb-sep">›</span>
        <span>부서별 안내</span>
    </div>
</div>

<div class="page-content">

    <div class="card-grid" style="margin-bottom: 24px;">
        <th:block th:if="${!#lists.isEmpty(departments)}">
            <div class="info-card" th:each="d : ${departments}">
                <h3 th:text="${d.name}">부서명</h3>
                <p>
                    <span th:if="${d.worshipTime != null}">예배 시간: <th:block th:text="${d.worshipTime}"></th:block><br></span>
                    <span th:if="${d.location != null}">장소: <th:block th:text="${d.location}"></th:block><br></span>
                    <span th:if="${d.staffInCharge != null}">담당 교역자: <th:block th:text="${d.staffInCharge}"></th:block><br></span>
                    <span th:if="${d.description != null}" th:text="${d.description}"></span>
                </p>
            </div>
        </th:block>
        <th:block th:if="${#lists.isEmpty(departments)}">
            <div class="info-card">
                <h3>장년부</h3>
                <p>예배 시간: 주일 오전 11:00<br>장소: 본당<br>소개 내용을 작성해주세요.</p>
            </div>
            <div class="info-card">
                <h3>청년부</h3>
                <p>예배 시간: 주일 오후 2:00<br>장소: 청년부실<br>소개 내용을 작성해주세요.</p>
            </div>
        </th:block>
    </div>

    <div style="text-align:center;">
        <a href="/worship/schedule" class="btn-outline">예배 시간표 보기</a>
    </div>

</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
</body>
</html>
