<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common(title='예배 시간표 - 샘물교회', description=null, keywords=null, ogTitle=null, ogDescription=null, includeKakaoMap=false)}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('worship-schedule')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">WORSHIP</div>
        <h1>예배 안내</h1>
        <p class="page-hero-sub">Worship Schedule</p>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <span>예배 안내</span>
    </div>
</div>

<div class="page-content">

    <th:block th:if="${!#lists.isEmpty(schedules)}"
              th:with="sunday=${schedules.?[category == 'SUNDAY']}, weekday=${schedules.?[category == 'WEEKDAY']}">
        <!-- 주일 예배 -->
        <div class="content-section" th:if="${!#lists.isEmpty(sunday)}">
            <div class="section-eyebrow">SUNDAY</div>
            <h2>주일 예배</h2>
            <div class="worship-row" th:each="s : ${sunday}">
                <div class="worship-row-info">
                    <h3 th:text="${s.name}">예배명</h3>
                    <p th:text="${s.description}"></p>
                </div>
                <div class="worship-time-badge" th:text="${s.serviceTime}">00:00</div>
            </div>
        </div>

        <!-- 주중 예배 -->
        <div class="content-section" th:if="${!#lists.isEmpty(weekday)}">
            <div class="section-eyebrow">WEEKDAY</div>
            <h2>주중 예배</h2>
            <div class="worship-row" th:each="s : ${weekday}">
                <div class="worship-row-info">
                    <h3 th:text="${s.name}">예배명</h3>
                    <p th:text="${s.description}"></p>
                </div>
                <div class="worship-time-badge" th:text="${s.serviceTime}">00:00</div>
            </div>
        </div>
    </th:block>

    <!-- 데이터가 없을 때 기본 안내 -->
    <th:block th:if="${#lists.isEmpty(schedules)}">
        <div class="content-section">
            <div class="section-eyebrow">SUNDAY</div>
            <h2>주일 예배</h2>
            <div class="worship-row">
                <div class="worship-row-info"><h3>1부 예배</h3><p>주일 오전 · 본당</p></div>
                <div class="worship-time-badge">9:00</div>
            </div>
            <div class="worship-row">
                <div class="worship-row-info"><h3>2부 예배</h3><p>주일 오전 · 본당</p></div>
                <div class="worship-time-badge">11:00</div>
            </div>
        </div>
        <div class="content-section">
            <div class="section-eyebrow">WEEKDAY</div>
            <h2>주중 예배</h2>
            <div class="worship-row">
                <div class="worship-row-info"><h3>수요 예배</h3><p>수요일 · 본당</p></div>
                <div class="worship-time-badge">19:30</div>
            </div>
        </div>
    </th:block>

    <div style="text-align:center; margin-top:8px;">
        <a href="/worship/department" class="btn-navy">부서별 안내 보기</a>
    </div>

</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
</body>
</html>
