<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담임목사 인사말 - 샘물교회</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('about-pastor')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">PASTOR</div>
        <h1>담임목사 인사말</h1>
        <p class="page-hero-sub">A Message from Our Pastor</p>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/about/church">교회 소개</a>
        <span class="breadcrumb-sep">›</span>
        <span>담임목사</span>
    </div>
</div>

<div class="page-content">
    <div class="person-card">
        <div class="person-card-img" th:if="${pastor != null and pastor.photoUrl != null}">
            <img th:src="${pastor.photoUrl}" alt="담임목사 사진"
                 style="width:100%;height:100%;object-fit:cover;border-radius:4px;"
                 onerror="this.parentElement.style.display='none'">
        </div>
        <div class="person-card-body">
            <div class="role" th:text="${pastor != null and pastor.role != null} ? ${pastor.role} : '담임목사'">담임목사</div>
            <h2 th:text="${pastor != null and pastor.name != null} ? ${pastor.name} : '담임목사 이름'">담임목사 이름</h2>
            <p th:if="${pastor != null and pastor.greeting != null}"
               th:text="${pastor.greeting}" style="white-space: pre-wrap;"></p>
            <th:block th:if="${pastor == null or pastor.greeting == null}">
                <p>인사말 내용을 작성해주세요. 목사님의 메시지와 교회의 방향성을 담아 작성하시면 됩니다.</p>
                <p>하나님의 은혜와 사랑으로 함께하는 샘물교회에 오신 것을 환영합니다.</p>
            </th:block>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
</body>
</html>
