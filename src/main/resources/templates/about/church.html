<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common(title='교회 소개 - 샘물교회', description=null, keywords=null, ogTitle=null, ogDescription=null, includeKakaoMap=false)}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('about-church')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">ABOUT US</div>
        <h1>교회 소개</h1>
        <p class="page-hero-sub">Our Vision & Mission</p>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <span>교회 소개</span>
    </div>
</div>

<div class="page-content">

    <div class="content-section">
        <div class="section-eyebrow">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M8 2C4 2 1 8 1 8s3 6 7 6 7-6 7-6-3-6-7-6z"/>
                <circle cx="8" cy="8" r="2.5"/>
            </svg>
            VISION
        </div>
        <h2>비전</h2>
        <p th:if="${churchInfo != null and churchInfo.vision != null}"
           th:text="${churchInfo.vision}" style="white-space: pre-wrap;"></p>
        <p th:if="${churchInfo == null or churchInfo.vision == null}">교회의 비전을 작성해주세요.</p>
    </div>

    <div class="content-section">
        <div class="section-eyebrow">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="8" cy="8" r="6.5"/>
                <circle cx="8" cy="8" r="3"/>
                <line x1="8" y1="1.5" x2="8" y2="3"/>
                <line x1="8" y1="13" x2="8" y2="14.5"/>
                <line x1="1.5" y1="8" x2="3" y2="8"/>
                <line x1="13" y1="8" x2="14.5" y2="8"/>
            </svg>
            MISSION
        </div>
        <h2>사명</h2>
        <p th:if="${churchInfo != null and churchInfo.mission != null}"
           th:text="${churchInfo.mission}" style="white-space: pre-wrap;"></p>
        <p th:if="${churchInfo == null or churchInfo.mission == null}">교회의 사명을 작성해주세요.</p>
    </div>

    <div class="content-section">
        <div class="section-eyebrow">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="2" y="2" width="12" height="13" rx="1"/>
                <line x1="5" y1="6" x2="11" y2="6"/>
                <line x1="5" y1="9" x2="11" y2="9"/>
                <line x1="5" y1="12" x2="8" y2="12"/>
            </svg>
            HISTORY
        </div>
        <h2>역사</h2>
        <p th:if="${churchInfo != null and churchInfo.history != null}"
           th:text="${churchInfo.history}" style="white-space: pre-wrap;"></p>
        <p th:if="${churchInfo == null or churchInfo.history == null}">교회의 역사를 작성해주세요.</p>
    </div>

</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
