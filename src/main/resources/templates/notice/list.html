<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 샘물교회</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('notice')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">NOTICE</div>
        <h1>공지사항</h1>
        <p class="page-hero-sub">Church Announcements</p>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <span>공지사항</span>
    </div>
</div>

<div class="page-content">
    <div class="content-section">
        <table class="notice-table">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성일</th>
                    <th>조회수</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${notices.totalElements == 0}">
                    <td colspan="4" style="text-align:center; padding:40px; color:#999;">등록된 공지사항이 없습니다.</td>
                </tr>
                <tr th:each="notice, stat : ${notices.content}">
                    <td th:text="${notices.totalElements - (notices.number * notices.size + stat.index)}"></td>
                    <td><a th:href="@{/notice/detail/{id}(id=${notice.id})}" th:text="${notice.title}">제목</a></td>
                    <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">날짜</td>
                    <td th:text="${notice.viewCount}">0</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이지네이션 -->
        <div class="site-pagination" th:if="${notices.totalPages > 1}">
            <a th:if="${!notices.first}" th:href="@{/notice/list(page=${notices.number - 1})}" class="page-btn">이전</a>
            <span th:each="i : ${#numbers.sequence(0, notices.totalPages - 1)}">
                <a th:href="@{/notice/list(page=${i})}"
                   th:text="${i + 1}"
                   th:classappend="${i == notices.number} ? 'page-btn active' : 'page-btn'"></a>
            </span>
            <a th:if="${!notices.last}" th:href="@{/notice/list(page=${notices.number + 1})}" class="page-btn">다음</a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
</body>
</html>
