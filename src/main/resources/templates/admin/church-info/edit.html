<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{admin/fragments/layout :: adminLayout(~{::title}, ~{::main}, 'church-info')}">

<title th:fragment="title">교회소개 관리</title>

<main th:fragment="main">
<style>
    .edit-card {
        background: #fff;
        border: 1px solid #DDE4EF;
        border-radius: 10px;
        overflow: hidden;
        max-width: 820px;
    }
    textarea.form-control { min-height: 120px; }
    @media (max-width: 600px) {
        .edit-card { border-radius: 8px; }
        .card-body { padding: 18px 16px; }
        .form-actions { padding: 14px 16px; }
    }
</style>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
<div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

<div class="edit-card">
    <div class="card-header">교회소개 내용 관리</div>
    <form th:action="@{/admin/church-info/save}" method="post" th:object="${churchInfo}">
        <input type="hidden" th:field="*{id}">
        <div class="card-body">
            <div class="form-group">
                <label class="form-label" for="vision">비전 (VISION)</label>
                <textarea id="vision" name="vision" class="form-control"
                          th:text="*{vision}"
                          placeholder="교회의 비전을 입력하세요."></textarea>
                <div class="form-hint">공개 페이지 '비전' 섹션에 표시됩니다.</div>
            </div>
            <div class="form-group">
                <label class="form-label" for="mission">사명 (MISSION)</label>
                <textarea id="mission" name="mission" class="form-control"
                          th:text="*{mission}"
                          placeholder="교회의 사명을 입력하세요."></textarea>
                <div class="form-hint">공개 페이지 '사명' 섹션에 표시됩니다.</div>
            </div>
            <div class="form-group">
                <label class="form-label" for="history">역사 (HISTORY)</label>
                <textarea id="history" name="history" class="form-control" style="min-height:180px;"
                          th:text="*{history}"
                          placeholder="교회의 역사를 입력하세요."></textarea>
                <div class="form-hint">공개 페이지 '역사' 섹션에 표시됩니다.</div>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-save">
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 7l3.5 3.5L11 3"/>
                </svg>
                저장
            </button>
        </div>
    </form>
</div>

</main>

</th:block>
</html>
