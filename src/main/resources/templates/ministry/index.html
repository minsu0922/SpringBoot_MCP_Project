<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사역 소개 - 샘물교회</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        /* 카테고리 필터 탭 */
        .ministry-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .ministry-filter-btn {
            display: inline-flex;
            align-items: center;
            min-height: 40px;
            padding: 8px 20px;
            border: 1px solid rgba(13,43,85,0.2);
            border-radius: 2px;
            background: transparent;
            color: var(--text-mid);
            font-size: 12px;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .ministry-filter-btn:hover,
        .ministry-filter-btn.active {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
        }

        /* 사진 그리드 */
        .ministry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .ministry-card {
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(13,43,85,0.08);
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .ministry-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(13,43,85,0.12);
        }
        .ministry-card-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            height: auto;
            object-fit: cover;
            display: block;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
            position: relative;
        }
        /* 이미지 없을 때 플레이스홀더 */
        .ministry-card-placeholder {
            width: 100%;
            aspect-ratio: 4 / 3;
            height: auto;
            background: linear-gradient(135deg, #0D2B55 0%, #185FA5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(181,212,244,0.5);
            font-size: 36px;
        }
        .ministry-card-body {
            padding: 18px 20px 20px;
        }
        .ministry-card-tag {
            display: inline-block;
            margin-bottom: 8px;
            padding: 2px 10px;
            border: 1px solid rgba(13,43,85,0.2);
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--navy-mid);
            font-weight: 500;
        }
        .ministry-card-body h3 {
            font-family: 'Noto Serif KR', serif;
            font-size: 15px;
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .ministry-card-body p {
            font-size: 13px;
            font-weight: 300;
            line-height: 1.7;
            color: var(--text-mid);
        }

        /* 사진 없을 때 안내 */
        .ministry-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .ministry-empty p { font-size: 14px; font-weight: 300; }

        /* 라이트박스 */
        .lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5,12,28,0.92);
            z-index: 9000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lightbox-overlay.show { display: flex; }
        .lightbox-inner {
            position: relative;
            max-width: 800px;
            width: 100%;
        }
        .lightbox-img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 4px;
            display: block;
        }
        .lightbox-info {
            margin-top: 16px;
            text-align: center;
        }
        .lightbox-info h3 {
            font-family: 'Noto Serif KR', serif;
            font-size: 18px;
            font-weight: 300;
            color: #fff;
            margin-bottom: 6px;
        }
        .lightbox-info p {
            font-size: 13px;
            font-weight: 300;
            color: rgba(181,212,244,0.7);
            line-height: 1.7;
        }
        .lightbox-close {
            position: absolute;
            top: -48px;
            right: 0;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            color: rgba(255,255,255,0.7);
            font-size: 22px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .lightbox-close:hover { color: #fff; }
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            color: rgba(255,255,255,0.8);
            font-size: 28px;
            width: 48px; height: 48px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
            z-index: 9001;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.18); color: #fff; }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-nav:disabled { opacity: 0.2; cursor: default; }

        /* 페이지 히어로 */
        .ministry-hero {
            background: linear-gradient(160deg, var(--navy) 0%, #0f3568 100%);
            padding: 80px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .ministry-grid { grid-template-columns: 1fr 1fr; }
            .ministry-hero { padding: 60px 24px; }
        }
        @media (max-width: 600px) {
            .ministry-grid { grid-template-columns: 1fr; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 22px; }
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
            .lightbox-inner { padding: 0 48px; }
        }
        @media (max-width: 480px) {
            .ministry-filter { gap: 6px; }
            .ministry-filter-btn { font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/public :: siteNav('ministry')}"></th:block>

<!-- 페이지 히어로 -->
<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">MINISTRY</div>
        <h1 class="page-hero-title">사역 소개</h1>
        <p class="page-hero-desc">샘물교회의 다양한 사역을 사진으로 만나보세요.</p>
    </div>
</div>

<!-- 사역 사진 목록 -->
<div class="page-content">
    <div class="page-inner" style="max-width: 1100px;">

        <!-- 카테고리 필터 -->
        <div class="ministry-filter">
            <button class="ministry-filter-btn active" data-cat="ALL">전체</button>
            <button class="ministry-filter-btn" data-cat="WORSHIP">찬양 사역</button>
            <button class="ministry-filter-btn" data-cat="CHILDREN">어린이 사역</button>
            <button class="ministry-filter-btn" data-cat="YOUTH">청년부</button>
            <button class="ministry-filter-btn" data-cat="MISSION">선교 사역</button>
            <button class="ministry-filter-btn" data-cat="COMMUNITY">소그룹</button>
            <button class="ministry-filter-btn" data-cat="ETC">기타</button>
        </div>

        <!-- 사진 그리드 -->
        <div class="ministry-grid" id="ministryGrid">

            <!-- 사진이 있을 때 -->
            <th:block th:if="${not #lists.isEmpty(photos)}">
                <div class="ministry-card"
                     th:each="photo : ${photos}"
                     th:attr="data-cat=${photo.category},data-url=${photo.photoUrl},data-title=${photo.title},data-desc=${photo.description}"
                     onclick="openLightboxFromCard(this)">
                    <!-- 사진 -->
                    <img class="ministry-card-img"
                         th:src="${photo.photoUrl}"
                         th:alt="${photo.title}"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="ministry-card-placeholder" style="display:none;">📷</div>
                    <!-- 정보 -->
                    <div class="ministry-card-body">
                        <span class="ministry-card-tag" th:text="${photo.category}">CATEGORY</span>
                        <h3 th:text="${photo.title}">사역 제목</h3>
                        <p th:if="${photo.description != null and !photo.description.isEmpty()}"
                           th:text="${photo.description}">사역 설명</p>
                    </div>
                </div>
            </th:block>

            <!-- 사진이 없을 때 -->
            <div class="ministry-empty" th:if="${#lists.isEmpty(photos)}">
                <p>등록된 사역 사진이 없습니다.</p>
            </div>
        </div>
    </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
    <div class="lightbox-inner" onclick="event.stopPropagation()">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" onclick="moveLightbox(-1)">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext" onclick="moveLightbox(1)">&#8250;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <h3 id="lightboxTitle"></h3>
            <p id="lightboxDesc"></p>
            <span id="lightboxCounter" style="font-size:12px; color:rgba(181,212,244,0.5); letter-spacing:0.1em;"></span>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
<script>
    /* 카테고리 필터 */
    const filterBtns = document.querySelectorAll('.ministry-filter-btn');
    const cards = document.querySelectorAll('.ministry-card');

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cat = btn.dataset.cat;
            cards.forEach(card => {
                // DB 카테고리 값과 대소문자 무관하게 비교
                const cardCat = (card.dataset.cat || '').toUpperCase();
                if (cat === 'ALL' || cardCat === cat.toUpperCase()) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    });

    /* 라이트박스 */
    let currentIndex = 0;
    let visibleCards = [];

    function getVisibleCards() {
        return Array.from(document.querySelectorAll('.ministry-card'))
            .filter(c => c.style.display !== 'none');
    }

    function openLightboxFromCard(card) {
        visibleCards = getVisibleCards();
        currentIndex = visibleCards.indexOf(card);
        renderLightbox();
        document.getElementById('lightboxOverlay').classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function renderLightbox() {
        const card = visibleCards[currentIndex];
        if (!card) return;
        document.getElementById('lightboxImg').src   = card.dataset.url   || '';
        document.getElementById('lightboxImg').alt   = card.dataset.title || '';
        document.getElementById('lightboxTitle').textContent = card.dataset.title || '';
        document.getElementById('lightboxDesc').textContent  = card.dataset.desc  || '';
        document.getElementById('lightboxCounter').textContent =
            visibleCards.length > 1 ? (currentIndex + 1) + ' / ' + visibleCards.length : '';
        document.getElementById('lightboxPrev').disabled = currentIndex <= 0;
        document.getElementById('lightboxNext').disabled = currentIndex >= visibleCards.length - 1;
    }

    function moveLightbox(dir) {
        const next = currentIndex + dir;
        if (next < 0 || next >= visibleCards.length) return;
        currentIndex = next;
        renderLightbox();
    }

    function closeLightbox() {
        document.getElementById('lightboxOverlay').classList.remove('show');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        const overlay = document.getElementById('lightboxOverlay');
        if (!overlay.classList.contains('show')) return;
        if (e.key === 'Escape')     closeLightbox();
        if (e.key === 'ArrowLeft')  moveLightbox(-1);
        if (e.key === 'ArrowRight') moveLightbox(1);
    });
</script>
</body>
</html>
